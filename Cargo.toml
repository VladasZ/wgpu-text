[package]
name = "hilen-wgpu-text"
authors = ["Leon (Blatko1)"]
version = "30.0.1"
edition = "2024"
description = "A simple 2D text renderer for wgpu."
license = "MIT"
readme = "README.md"
repository = "https://github.com/VladasZ/wgpu-text"
keywords = ["wgpu", "text", "ttf", "render", "font"]
categories = ["graphics", "rendering"]
include = ["src/**/*", "LICENSE", "Cargo.toml", "README.md", ".gitignore"]

[dependencies]
wgpu = { package = "hilen-wgpu", version = "30.0" }
glyph_brush = "0.7.12"
log = "^0.4.30"
bytemuck = { version = "^1.20.0", features = ["derive"] }

[dev-dependencies]
wgpu = { package = "hilen-wgpu", version = "30.0", features = ["spirv"] }
winit = "0.30.13"
pollster = "0.4.0"
env_logger = "^0.11.0"
rand = "0.10.2"
nalgebra = "0.35.0"

[[example]]
path = "examples/custom_target/custom_target.rs"
name = "custom_target"
